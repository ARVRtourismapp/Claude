<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blackjack</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>♠ Blackjack ♥</h1>
  <div id="table">
    <div class="hand-area">
      <div class="label">Dealer</div>
      <div class="cards" id="dealer-cards"></div>
      <div class="score" id="dealer-score"></div>
    </div>
    <hr id="divider">
    <div class="hand-area">
      <div class="label">You</div>
      <div class="cards" id="player-cards"></div>
      <div class="score" id="player-score"></div>
    </div>
    <div id="status">Place your bet and deal!</div>
    <div id="controls">
      <div id="balance-display">
        Balance: <span id="bal">500</span> &nbsp;|&nbsp; Bet: <span id="cur-bet">0</span>
      </div>
      <div id="bet-area">
        <label for="bet-input">Bet $</label>
        <input type="number" id="bet-input" value="10" min="1">
      </div>
      <div class="btn-row">
        <button id="btn-deal">Deal</button>
        <button id="btn-hit" disabled>Hit</button>
        <button id="btn-stand" disabled>Stand</button>
        <button id="btn-new" style="display:none">New Game</button>
      </div>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
